name: e2e

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      snapshot_id: ${{ steps.snapshot.outputs.snapshot_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install workspace dependencies
        run: npm ci

      - name: Install openapi-python-client
        run: pip install openapi-python-client

      - name: Generate SDKs
        run: bash generate.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-sdk
          path: |
            together-sandbox-typescript/src/api-clients/
            together-sandbox-typescript/LLMS.md
            together-sandbox-typescript/docs/
            together-sandbox-python/together_sandbox/api/
            together-sandbox-python/together_sandbox/sandbox/
            together-sandbox-python/LLMS.md
            together-sandbox-python/docs/

      - name: Build CLI binary
        working-directory: together-sandbox-cli
        run: bun run build:binary

      - name: Create snapshot
        id: snapshot
        working-directory: together-sandbox-cli
        run: |
          # `bash -e` does not exit on a failing command substitution in a
          # variable assignment (well-known gotcha — see BashFAQ #105), so we
          # explicitly propagate the CLI's exit code with `|| exit $?`. We
          # then validate that what `tail -1` captured is actually a UUID —
          # this guards against any future change that adds output after the
          # snapshot id (which would silently corrupt $TOGETHER_SNAPSHOT_ID
          # for every downstream job).
          SNAPSHOT_ID=$(./dist/together-sandbox snapshots create --image alpine:latest --ci | tail -1) || exit $?
          if [[ ! "$SNAPSHOT_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "::error title=prepare::expected UUID snapshot id, got '$SNAPSHOT_ID'"
            exit 1
          fi
          echo "snapshot_id=$SNAPSHOT_ID" >> "$GITHUB_OUTPUT"
          echo "::notice title=prepare::snapshot_id=$SNAPSHOT_ID"
        env:
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          TOGETHER_BASE_URL: https://api.bartender.codesandbox.io

  e2e-python:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: generated-sdk
          run-id: ${{ github.run_id }}
      - name: Install dependencies
        run: |
          cd together-sandbox-python
          pip install ".[dev]"
      - name: Run e2e tests
        run: pytest tests/e2e/ -v
        working-directory: together-sandbox-python
        env:
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          TOGETHER_SNAPSHOT_ID: ${{ needs.prepare.outputs.snapshot_id }}
          TOGETHER_BASE_URL: https://api.bartender.codesandbox.io

  e2e-typescript:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: generated-sdk
          run-id: ${{ github.run_id }}
      - name: Install dependencies
        run: npm ci
      - name: Run e2e tests
        run: npm run test:e2e
        working-directory: together-sandbox-typescript
        env:
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          TOGETHER_SNAPSHOT_ID: ${{ needs.prepare.outputs.snapshot_id }}
          TOGETHER_BASE_URL: https://api.bartender.codesandbox.io
